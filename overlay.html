<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla · BCN DESPERTA</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@600;800&family=Roboto+Condensed:wght@600;700&family=Work+Sans:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --acento:#E4002B; --fuente:'Oswald';
    --col-tit:#ffffff; --col-fra:#ffffff;
    --tam-tit:clamp(34px,5.6vw,96px); --tam-fra:clamp(18px,2.1vw,36px);
    --head-h:80px; --head-pt:3vh; --head-px:5vw;
    --sh-tit:0 3px 18px rgba(0,0,0,.85); --sh-fra:0 2px 12px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:transparent;font-family:'Inter',sans-serif;overflow:hidden;}
  #bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #header{position:fixed;top:0;left:0;right:0;display:none;padding:var(--head-pt) var(--head-px);z-index:3;}
  #header img{max-height:var(--head-h);width:auto;}
  .stage{position:fixed;inset:0;z-index:2;}
  .item{position:absolute;}
  .item .titular{
    font-family:var(--fuente),'Oswald',Arial,sans-serif;font-weight:700;text-transform:uppercase;
    line-height:1.02;font-size:var(--tam-tit);color:var(--col-tit);
    border-left:.14em solid var(--acento);padding-left:.32em;text-shadow:var(--sh-tit);}
  .item .frase{
    font-family:var(--fuente),'Inter',sans-serif;font-weight:500;font-style:italic;color:var(--col-fra);
    font-size:var(--tam-fra);margin-top:.35em;text-shadow:var(--sh-fra);white-space:pre-wrap;}
  .item[data-h="c"] .titular,.item[data-h="r"] .titular{border-left:none;padding-left:0;}
  .in{animation:var(--anim-name,fadeup) var(--anim-dur,.5s) cubic-bezier(.2,.7,.2,1) both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeup{from{opacity:0;transform:var(--tf-from);}to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){.in{animation:none;}}
</style>
</head>
<body>
  <img id="bgimg" alt="">
  <div id="header"></div>
  <div class="stage" id="stage"></div>
<script>
  const $=id=>document.getElementById(id);
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let shown=new Set();

  function aplicarFondo(f){
    f=f||{tipo:'transparente'}; const img=$('bgimg');
    if(f.tipo==='color'){ document.body.style.background=f.valor||'#000'; img.style.display='none'; }
    else if(f.tipo==='imagen' && f.valor){ img.src=f.valor; img.style.display='block'; document.body.style.background='transparent'; }
    else { document.body.style.background='transparent'; img.style.display='none'; }
  }
  function estiloItem(it){
    const x=(it.x!=null?it.x:8), y=(it.y!=null?it.y:82), h=it.h||'l';
    const tx = h==='l'?'0': h==='c'?'-50%':'-100%';
    const ta = h==='l'?'left': h==='c'?'center':'right';
    return {css:`position:absolute;left:${x}%;top:${y}%;transform:translate(${tx},-50%);max-width:70vw;text-align:${ta};`, tx};
  }
  function render(e){
    e=e||{}; const r=document.documentElement.style;
    if(e.acento) r.setProperty('--acento',e.acento);
    const t=e.tipo||{};
    if(t.fuente) r.setProperty('--fuente',"'"+t.fuente+"'");
    if(t.color) r.setProperty('--col-tit',t.color);
    if(t.colorFrase) r.setProperty('--col-fra',t.colorFrase);
    r.setProperty('--tam-tit', (t.tamTitular>0)? t.tamTitular+'px':'clamp(34px,5.6vw,96px)');
    r.setProperty('--tam-fra', (t.tamFrase>0)? t.tamFrase+'px':'clamp(18px,2.1vw,36px)');
    r.setProperty('--sh-tit', t.sombra===false?'none':'0 3px 18px rgba(0,0,0,.85)');
    r.setProperty('--sh-fra', t.sombra===false?'none':'0 2px 12px rgba(0,0,0,.9)');
    aplicarFondo(e.fondo);

    const h=e.header||{}; const hd=$('header');
    if(h.logo){ hd.style.display='flex';
      hd.style.justifyContent = h.pos==='c'?'center':h.pos==='r'?'flex-end':'flex-start';
      r.setProperty('--head-h',(h.size||80)+'px');
      r.setProperty('--head-pt',(h.pt!=null?h.pt:24)+'px');
      r.setProperty('--head-px',(h.px!=null?h.px:64)+'px');
      hd.innerHTML=`<img src="${h.logo}">`; }
    else { hd.style.display='none'; hd.innerHTML=''; }

    const an=e.anim||{}; const animar = an.tipo!=='none';
    r.setProperty('--anim-dur', (an.dur!=null?an.dur:0.5)+'s');
    r.setProperty('--anim-name', an.tipo==='fade'?'fade':'fadeup');

    const items=e.items||[];
    $('stage').innerHTML = items.map(it=>{
      const s=estiloItem(it);
      return `<div class="item" data-id="${it.id}" data-h="${it.h||'l'}" style="${s.css};--tf-from:translate(${s.tx},calc(-50% + .4em))">`+
        (it.titular?`<div class="titular">${esc(it.titular)}</div>`:'')+
        (it.frase?`<div class="frase">${esc(it.frase)}</div>`:'')+`</div>`;
    }).join('');
    items.forEach(it=>{ if(!shown.has(it.id)){ if(animar){ const el=$('stage').querySelector('[data-id="'+it.id+'"]'); if(el) el.classList.add('in'); } shown.add(it.id);} });
    shown=new Set(items.map(it=>it.id));
  }

  try{ const ch=new BroadcastChannel('bcn_overlay'); ch.onmessage=ev=>render(ev.data); }catch(_){}
  window.addEventListener('storage', ev=>{ if(ev.key==='bcn_overlay_state' && ev.newValue) render(JSON.parse(ev.newValue)); });
  try{ const s=localStorage.getItem('bcn_overlay_state'); if(s) render(JSON.parse(s)); }catch(_){}
</script>
</body>
</html>
