<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla · BCN DESPERTA</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@600;800&family=Roboto+Condensed:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --acento:#E4002B; --fuente:'Oswald';
    --col-tit:#ffffff; --col-fra:#ffffff;
    --tam-tit:clamp(38px,6.5vw,110px); --tam-fra:clamp(20px,2.4vw,40px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:transparent;font-family:'Inter',sans-serif;overflow:hidden;}
  #bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  .stage{position:fixed;inset:0;}
  .zone{position:absolute;display:flex;flex-direction:column;gap:2.2vh;}
  .item .titular{
    font-family:var(--fuente),'Oswald',Arial,sans-serif;font-weight:700;text-transform:uppercase;
    line-height:1.02;font-size:var(--tam-tit);color:var(--col-tit);
    border-left:.14em solid var(--acento);padding-left:.32em;text-shadow:0 3px 18px rgba(0,0,0,.85);}
  .item .frase{
    font-family:var(--fuente),'Inter',sans-serif;font-weight:500;font-style:italic;color:var(--col-fra);
    font-size:var(--tam-fra);margin-top:.35em;max-width:min(60ch,72vw);
    text-shadow:0 2px 12px rgba(0,0,0,.9);white-space:pre-wrap;}
  /* la barra de acento solo en alineados a la izquierda */
  .zone[data-h="c"] .item .titular,.zone[data-h="r"] .item .titular{border-left:none;padding-left:0;}
  .in{animation:in .5s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes in{from{opacity:0;transform:translateY(.4em);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.in{animation:none;}}
</style>
</head>
<body>
  <img id="bgimg" alt="">
  <div class="stage" id="stage"></div>
<script>
  const $=id=>document.getElementById(id);
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let shown=new Set();

  function aplicarFondo(f){
    f=f||{tipo:'transparente'}; const img=$('bgimg');
    if(f.tipo==='color'){ document.body.style.background=f.valor||'#000'; img.style.display='none'; }
    else if(f.tipo==='imagen' && f.valor){ img.src=f.valor; img.style.display='block'; document.body.style.background='transparent'; }
    else { document.body.style.background='transparent'; img.style.display='none'; }
  }
  function estiloZona(pos){
    const v=pos[0], h=pos[1];
    const tx = h==='c'?'-50%':'0', ty = v==='m'?'-50%':'0';
    let s='';
    s += h==='l'?'left:5vw;': h==='c'?'left:50%;':'right:5vw;';
    s += v==='t'?'top:5vh;': v==='m'?'top:50%;':'bottom:5vh;';
    s += `transform:translate(${tx},${ty});`;
    s += 'align-items:'+(h==='l'?'flex-start':h==='c'?'center':'flex-end')+';';
    s += 'text-align:'+(h==='l'?'left':h==='c'?'center':'right')+';';
    s += 'max-width:'+(h==='c'?'70vw':'44vw')+';';
    return s;
  }
  function render(e){
    e=e||{}; const r=document.documentElement.style;
    if(e.acento) r.setProperty('--acento',e.acento);
    const t=e.tipo||{};
    if(t.fuente) r.setProperty('--fuente',"'"+t.fuente+"'");
    if(t.color) r.setProperty('--col-tit',t.color);
    if(t.colorFrase) r.setProperty('--col-fra',t.colorFrase);
    r.setProperty('--tam-tit', (t.tamTitular>0)? t.tamTitular+'px':'clamp(38px,6.5vw,110px)');
    r.setProperty('--tam-fra', (t.tamFrase>0)? t.tamFrase+'px':'clamp(20px,2.4vw,40px)');
    aplicarFondo(e.fondo);

    const items=e.items||[];
    const grupos={};
    items.forEach(it=>{ const p=(it.pos&&it.pos.length===2)?it.pos:'bl'; (grupos[p]=grupos[p]||[]).push(it); });
    $('stage').innerHTML = Object.keys(grupos).map(pos=>{
      const inner = grupos[pos].map(it=>`<div class="item" data-id="${it.id}">`+
        (it.titular?`<div class="titular">${esc(it.titular)}</div>`:'')+
        (it.frase?`<div class="frase">${esc(it.frase)}</div>`:'')+`</div>`).join('');
      return `<div class="zone" data-h="${pos[1]}" style="${estiloZona(pos)}">${inner}</div>`;
    }).join('');
    items.forEach(it=>{ if(!shown.has(it.id)){ const el=$('stage').querySelector('[data-id="'+it.id+'"]'); if(el) el.classList.add('in'); shown.add(it.id);} });
    shown=new Set(items.map(it=>it.id));
  }

  try{ const ch=new BroadcastChannel('bcn_overlay'); ch.onmessage=ev=>render(ev.data); }catch(_){}
  window.addEventListener('storage', ev=>{ if(ev.key==='bcn_overlay_state' && ev.newValue) render(JSON.parse(ev.newValue)); });
  try{ const s=localStorage.getItem('bcn_overlay_state'); if(s) render(JSON.parse(s)); }catch(_){}
</script>
</body>
</html>
